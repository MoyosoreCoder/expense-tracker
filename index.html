<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Expense Tracker</h1>
        <p>Keep track of your daily expenses</p>
    </header>

    <main>

        <!-- Expense Form -->
        <section class="expense-form-section">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseName">Expense</label>
                    <input type="text" id="expenseName" placeholder="e.g. Lunch" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="e.g. 5000" min="0" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>

                    <input type="date" id="date" required>
                </div>

                <button type="submit" id="addExpenseButton">
                    Add Expense
                </button>

            </form>

        </section>


        <!-- Expense Summary -->
        <section class="summary-section">

            <h2>Total Expenses</h2>

            <p id="totalExpenses">₦0.00</p>

        </section>


        <!-- Expense List -->
        <section class="expense-list-section">

            <h2>Expenses</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Expense</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
